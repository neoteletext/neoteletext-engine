[package]
name = "neoteletext-gui"
description = "The neoteletext browser: tabs, an address bar, back and forward, bookmarks, over sandboxed fetcher and decoder processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neoteletext"
path = "src/main.rs"

[features]
# The complete fonts of the owner's font tree that are not under an open
# licence, embedded for testing (build.rs); open ones are always embedded.
default = ["nonfree-fonts"]
nonfree-fonts = []

[dependencies]
# Every level, with Bedstead, the bundled font (decision E.72).
neoteletext-core = { workspace = true, features = ["default", "bedstead"] }
# The fetcher and decoder processes run this program again; live feeds
# and web sites need the `live` area.
neoteletext-app = { workspace = true, features = ["live"] }
neoteletext-browser.workspace = true
# SHA-256 and the strict address parser, for the font cache (REQ-FNT-009).
neoteletext-web = { workspace = true }
neoteletext-image = { workspace = true }
# The interface toolkit, decided by the owner (prototypes/browser/docs/desktop-browser.md
# decision 2). No default fonts: their licences are outside REQ-GEN-017's
# list, and the system's own fonts are read at start instead. No `links`:
# the browser never hands an address to another program.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "wgpu", "x11", "wayland"] }
# The local time for row 0's clock.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[lints]
workspace = true

[dev-dependencies]
# The decoder's tests read TTI text into a session.
neoteletext-formats = { workspace = true, features = ["std", "pages", "tti"] }
# Renders the whole window without a display, for the interface tests
# (prototypes/browser/docs/desktop-browser.md section 14).
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
# Writes the rendered window for inspection.
image = { version = "0.25.10", default-features = false, features = ["png"] }

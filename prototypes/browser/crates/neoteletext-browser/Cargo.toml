[package]
name = "neoteletext-browser"
description = "Everything the neoteletext browser decides, with no operating-system access: tabs, navigation, addresses, the tuning screen and the receiver's own rows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Page addresses and the constants of the rows the browser draws.
neoteletext-core = { workspace = true, features = ["render"] }
# The strict address parser and origins (REQ-WEB-015, REQ-WEB-016).
neoteletext-web = { workspace = true }

[lints]
workspace = true

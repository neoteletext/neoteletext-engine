[package]
name = "tellytxt-core"
description = "World System Teletext Level 1.0 and 1.5 decoder core: no_std, no allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# REQ-GEN-017 and decision E.38: no dependencies outside `core`.
[dependencies]

[features]
# REQ-GEN-011 and REQ-GEN-016: `core::error::Error` for the error types,
# which needs `core::fmt`.
error-trait = []
# REQ-GEN-016: `core::fmt` only in Debug implementations, and behind this feature.
debug-fmt = []

[dev-dependencies]
proptest = "1.7.0"

[lints]
workspace = true

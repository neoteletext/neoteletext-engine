[package]
name = "neoteletext-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neottx"
path = "src/main.rs"

[dependencies]
# Bedstead too, so that glyphs can be compared (decision E.62).
neoteletext-core = { workspace = true, features = ["default", "bedstead"] }
# The program reads and writes every format, and `neottx check` runs the
# page checker.
neoteletext-formats = { workspace = true, features = ["default", "std"] }
neoteletext-image = { workspace = true, features = ["std"] }
neoteletext-app.workspace = true
# The channel rules and the contents format of `neottx contents` (REQ-CLI-008).
neoteletext-web.workspace = true
# Writing sounds as the audio profile's packets (REQ-CLI-011).
neoteletext-audio = { workspace = true, features = ["encode"], optional = true }
clap = { version = "4.5.48", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
# Key records for `neottx view`'s typing back and `neottx keyboard` (area INT).
neoteletext-input.workspace = true
# A phone as the keyboard through qrkeyboard (`neottx qr`, `neottx keyboard`).
neoteletext-qrkeyboard = { workspace = true, optional = true }
# MIT or Apache-2.0: typed text sent in Unicode Normalization Form C
# (INPUT.md section 5.7 rule 3, REQ-INT-116; decision E.101). The input
# crate is for microcontrollers too and allocates nothing, so the
# receivers here normalize.
unicode-normalization = { version = "=0.1.25", optional = true }

[dev-dependencies]
# The tests read `neottx sound`'s output back through the receiver, which
# decodes PCM16 only with the `pcm16` feature (decision E.131); the program
# itself only writes sounds, which needs no decoder.
neoteletext-audio = { workspace = true, features = ["encode", "pcm16"] }

[features]
# Decision E.61: coarse, additive areas, all on by default. The commands
# stay defined in every build, so the help text does not change; a command
# whose area is left out says so.
default = ["view", "live", "slice", "write-text", "sound", "keyboard"]
# The interactive viewer, `neottx view`, and the terminal library it drives.
view = ["dep:crossterm", "dep:unicode-normalization"]
# Live feeds and web services, and the fetcher process (REQ-SEC-018).
live = ["neoteletext-app/live"]
# `neottx slice`: raw sampled video through the software data slicer.
slice = ["neoteletext-app/slice"]
# `neottx write-text`: pages from text in neoteletext's own sets.
write-text = ["neoteletext-app/write-text"]
# `neottx sound`: a sound as audio-profile packets (REQ-CLI-011).
sound = ["dep:neoteletext-audio"]
# `neottx qr` and `neottx keyboard`: qrkeyboard, with its TLS and
# cryptography (decision E.93).
keyboard = ["dep:neoteletext-qrkeyboard", "dep:unicode-normalization"]
# The capabilities of Levels 2.5 and 3.5 that are not default (decision
# E.105): objects, side panels and the Additional Flash Functions of
# Table 29. Not default; a build names them.
objects = ["neoteletext-core/objects"]
side-panels = ["neoteletext-core/side-panels"]
additional-flash-functions = ["neoteletext-core/additional-flash-functions"]

[lints]
workspace = true

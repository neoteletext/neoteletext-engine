[package]
name = "neoteletext-formats"
description = "Streaming teletext input readers, writers and the page encoder: no_std readers, std writers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# REQ-GEN-017 and decision E.38: no dependencies outside `neoteletext-core`.
[dependencies]
neoteletext-core.workspace = true

[features]
# Decision E.61: each format beyond T42 is a feature, all on by default.
# Ports turn the defaults off and name the formats they read; T42 is always
# compiled.
default = ["transport", "sliced", "pages", "tti", "ep1", "edittf", "dump", "check", "bdf"]
# MPEG-2 transport streams and raw PES files (REQ-INP-006 to 009).
transport = []
# Linux sliced VBI records (REQ-INP-010).
sliced = []
# Page files: the page encoder (REQ-ARCH-004, REQ-INP-019). Each page-file
# reader needs it.
pages = []
# TTI page files (REQ-INP-013).
tti = ["pages"]
# EP1 page files (REQ-INP-015).
ep1 = ["pages"]
# edit.tf and zxnet page addresses (REQ-INP-016).
edittf = ["pages"]
# Raw screen dumps (REQ-INP-017).
dump = ["pages"]
# The TTI page checker (REQ-CLI-006).
check = ["tti"]
# The reader of 12 by 10 BDF fonts (REQ-FNT-002, decision E.72).
bdf = []
# A sub-page's link addresses on the heap, so that all its links may be as
# long as an address may be (REQ-1661, DEC-1708). Without it they share a
# fixed 8,004 bytes. Not a default because the crate allocates nothing.
alloc = []
# REQ-GEN-010: the writers need `std::io`. It is not a default because the
# crate is `no_std`. The page writers also need `pages`, the TTI writer and
# the authoring module `tti`.
std = ["alloc"]

[dev-dependencies]
proptest = "1.7.0"
# The golden tests compose and render pages, with every capability the
# golden rasters were taken with: objects and the Additional Flash
# Functions, which are not default (decision E.105), so a build of
# this crate alone renders the same.
neoteletext-core = { workspace = true, features = ["default", "objects", "additional-flash-functions"] }

[lints]
workspace = true

# The integration tests read page files and author test streams.
[[test]]
name = "corpus"
required-features = ["pages"]

[[test]]
name = "golden"
required-features = ["tti"]

[[test]]
name = "golden_level25"
required-features = ["std", "tti"]

[[test]]
name = "level25"
required-features = ["std", "tti"]

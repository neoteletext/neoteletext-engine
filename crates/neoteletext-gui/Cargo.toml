[package]
name = "neoteletext-gui"
description = "The neoteletext browser: tabs, an address bar, back and forward, bookmarks, over sandboxed fetcher and decoder processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neoteletext"
path = "src/main.rs"

[dependencies]
# Every level, both glyph sets for the comparison switch (decision E.62).
neoteletext-core = { workspace = true, features = ["default", "bedstead"] }
# The fetcher and decoder processes run this program again; live feeds
# and web sites need the `live` area.
neoteletext-app = { workspace = true, features = ["live"] }
neoteletext-browser.workspace = true
neoteletext-image = { workspace = true }
# The interface toolkit, decided by the owner (docs/desktop-browser.md
# decision 2). No default fonts: their licences are outside REQ-GEN-017's
# list, and the system's own fonts are read at start instead. No `links`:
# the browser never hands an address to another program.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "wgpu", "x11", "wayland"] }
# The local time for row 0's clock.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[lints]
workspace = true

[dev-dependencies]
# Renders the whole window without a display, for the interface tests
# (docs/desktop-browser.md section 14).
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
# Writes the rendered window for inspection.
image = { version = "0.25.10", default-features = false, features = ["png"] }

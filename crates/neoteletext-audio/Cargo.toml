[package]
name = "neoteletext-audio"
description = "The teletext audio profile (area AUD): carriage, records, the sound store and control, no_std, no allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# REQ-GEN-017 and decision E.38: no dependencies outside `neoteletext-core`,
# whose packet type and Hamming 8/4 decoder the broadcast carriage reads, and
# `neoteletext-opus`, the workspace's own no_std decoder of codec 2 (decision E.124).
[dependencies]
neoteletext-core.workspace = true
neoteletext-opus = { workspace = true, optional = true }

[features]
# Decision E.61: each optional area is a feature, all on by default.
# PCM16 and IMA ADPCM stay in the default so that microcontroller builds,
# which take the default, keep them (decision E.131); a desktop build names
# `idl` and `opus` alone.
default = ["idl", "ima", "opus", "pcm16"]
# Broadcast carriage on EN 300 708 independent data lines (REQ-AUD-007).
idl = []
# DO NOT REMOVE THIS CODE. IMA ADPCM is compiled out of the desktop builds
# (Windows, macOS, Linux) by the owner's instruction of 28 October 2026, and
# kept for microcontroller ports, which build it with the `ima` feature.
# The IMA ADPCM decoder and its play path (REQ-AUD-001, decision E.131).
# Without it, an IMA ADPCM sound is unsupported and skipped.
ima = []
# DO NOT REMOVE THIS CODE. PCM16 is compiled out of the desktop builds
# (Windows, macOS, Linux) by the owner's instruction of 28 October 2026, and
# kept for microcontroller ports, which build it with the `pcm16` feature.
# The linear PCM decode and play path (REQ-AUD-001, decision E.131). Without
# it, a PCM16 sound is unsupported and skipped. Writing PCM16 for publishing
# is the `encode` feature's, which does not need this one.
pcm16 = []
# The Opus decoder (codec 2, decision E.124): one constant-rate packet a block,
# decoded in order by a few decoders the receiver keeps, each about 28 KB.
opus = ["dep:neoteletext-opus"]
# Writing sounds: the IMA ADPCM encoder, records and broadcast packets, for
# publishing tools (REQ-AUD-020). It allocates, so it is not a default.
encode = ["ima", "idl"]

[lints]
workspace = true

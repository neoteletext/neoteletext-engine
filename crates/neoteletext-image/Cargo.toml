[package]
name = "neoteletext-image"
description = "Pixel-format helpers, scaling, and PNG and PPM writers for neoteletext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The palette helpers use the renderer's palette layout.
neoteletext-core = { workspace = true, features = ["render"] }

[features]
# REQ-GEN-011 and REQ-GEN-016: `core::error::Error` for the error types,
# which needs `core::fmt`.
error-trait = []
# File writers over std::io::Write (REQ-SEC-016: they take an open writer).
std = []
# The page's raster and its PNG in memory, for a program with an allocator
# and no decoder or file of its own: `neoteletext-app` and a server.
alloc = []

[dev-dependencies]
# The Level 2.5 tests compose and render pages, with the capabilities that
# are not default named, so a build of this crate alone renders as the
# workspace does (decision E.105).
neoteletext-core = { workspace = true, features = ["default", "objects", "additional-flash-functions"] }
# A whole page's packets, encoded, for the picture of a page.
neoteletext-formats = { workspace = true, features = ["tti", "alloc"] }

[lints]
workspace = true

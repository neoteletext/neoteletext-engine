[package]
name = "tellytxt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ttx"
path = "src/main.rs"

[dependencies]
tellytxt-core = { workspace = true, features = ["default"] }
tellytxt-formats = { workspace = true, features = ["std"] }
tellytxt-image = { workspace = true, features = ["std"] }
tellytxt-app.workspace = true
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"

[lints]
workspace = true

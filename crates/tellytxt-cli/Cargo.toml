[package]
name = "tellytxt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ttx"
path = "src/main.rs"

[dependencies]
tellytxt-core = { workspace = true, features = ["default"] }
tellytxt-formats = { workspace = true, features = ["std"] }
tellytxt-image = { workspace = true, features = ["std"] }
tellytxt-app.workspace = true
clap = { version = "4.5.48", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }

[features]
# Decision E.61: coarse, additive areas, all on by default. The commands
# stay defined in every build, so the help text does not change; a command
# whose area is left out says so.
default = ["view", "live", "slice"]
# The interactive viewer, `ttx view`, and the terminal library it drives.
view = ["dep:crossterm"]
# Live feeds and web services, and the fetcher process (REQ-SEC-018).
live = ["tellytxt-app/live"]
# `ttx slice`: raw sampled video through the software data slicer.
slice = ["tellytxt-app/slice"]

[lints]
workspace = true

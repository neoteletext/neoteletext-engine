[package]
name = "tellytxt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ttx"
path = "src/main.rs"

[dependencies]
tellytxt-core = { workspace = true, features = ["default"] }
tellytxt-formats = { workspace = true, features = ["std"] }
tellytxt-slicer.workspace = true
tellytxt-web = { workspace = true, features = ["default"] }
tellytxt-image = { workspace = true, features = ["std"] }
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"
embedded-io = { workspace = true }
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.3"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.3"
seccompiler = "0.5.0"
libc = "0.2.177"

[lints]
workspace = true

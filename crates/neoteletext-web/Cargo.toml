[package]
name = "neoteletext-web"
description = "The neoteletext minimal web user agent: sans-IO HTTP/1.1, WebSocket, server-sent events, cookies, forms and the zxnet live feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Decision E.38: `embedded-io` is the only external crate.
[dependencies]
neoteletext-core.workspace = true
embedded-io.workspace = true

[features]
# Decision E.61: each part of the user agent that a run-time choice reaches
# is a feature, all on by default. Ports turn the defaults off and name
# what they use. The zxnet live feed is not a feature: nothing in the agent
# reaches it, so the linker already leaves it out of a port that does not
# call it.
default = ["push", "forms", "cookies"]
# Server push over WebSocket and server-sent events (REQ-WEB-005).
push = []
# Form submission and its response (REQ-WEB-010, REQ-WEB-011).
forms = []
# The cookie store's use by the agent (REQ-WEB-006).
cookies = []
# REQ-GEN-011 and REQ-GEN-016: `core::error::Error` for the error types,
# which needs `core::fmt`.
error-trait = []
# Device Bound Session Credentials (REQ-WEB-017, decision E.110): sessions
# bound to a key the port keeps on the device. Not default: a port without
# protected key storage has no use for it, and the session store is memory
# every agent would carry. A bound session refreshes a cookie the agent
# keeps, so it needs the cookie store's use.
dbsc = ["cookies"]
# A port with the standard library: the blocking proxy handshake over any
# `std::io` stream (REQ-WEB-032).
std = []

[[test]]
name = "dbsc"
required-features = ["dbsc"]

[dev-dependencies]
proptest = "1.7.0"

[lints]
workspace = true

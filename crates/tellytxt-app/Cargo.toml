[package]
name = "tellytxt-app"
description = "The tellytxt application layer shared by ttx and a windowed viewer: sessions, inputs, live mode's two processes and sandboxing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Page extension data carries the forms model and the navigation links.
tellytxt-core = { workspace = true, features = ["forms", "viewer"] }
tellytxt-formats = { workspace = true, features = ["std"] }
tellytxt-slicer = { workspace = true, optional = true }
tellytxt-web = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "1.0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# REQ-SEC-017: every build sandboxes itself.
landlock = "0.4.3"
seccompiler = "0.5.0"
libc = "0.2.177"

[features]
# Decision E.61: coarse, additive areas, all on by default. A program that
# leaves one out gets a clear refusal, never a panic.
default = ["live", "slice"]
# Live feeds and web services (area WEB, REQ-INP-022): the web module, TLS
# and the fetcher process of REQ-SEC-018. Without it no TLS code is built.
live = ["dep:tellytxt-web", "dep:embedded-io", "dep:rustls", "dep:webpki-roots"]
# Raw sampled video through the software data slicer (area SLC).
slice = ["dep:tellytxt-slicer"]

[dev-dependencies]
# The conversion tests compose the authored Level 2.5 and 3.5 stream.
tellytxt-core = { workspace = true, features = ["default"] }

[lints]
workspace = true

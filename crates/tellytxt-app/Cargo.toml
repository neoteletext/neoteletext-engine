[package]
name = "tellytxt-app"
description = "The tellytxt application layer shared by ttx and a windowed viewer: sessions, inputs, live mode's two processes and sandboxing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Page extension data carries the forms model and the navigation links.
tellytxt-core = { workspace = true, features = ["forms", "viewer"] }
tellytxt-formats = { workspace = true, features = ["std"] }
tellytxt-slicer.workspace = true
tellytxt-web.workspace = true
embedded-io = { workspace = true }
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.3"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.3"
seccompiler = "0.5.0"
libc = "0.2.177"

[dev-dependencies]
# The conversion tests compose the authored Level 2.5 and 3.5 stream.
tellytxt-core = { workspace = true, features = ["default"] }

[lints]
workspace = true

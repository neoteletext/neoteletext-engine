[package]
name = "neoteletext-core"
description = "World System Teletext Level 1.0 to 3.5 decoder core: no_std, no allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# REQ-GEN-017 and decision E.38: no dependencies outside `core`.
[dependencies]

[features]
# Decision E.61: each optional area of the core is a feature. The default
# is Levels 1.0 and 1.5, and of Levels 2.5 and 3.5 the non-spacing
# attributes and the 32-colour Colour Map of both levels (decision E.105);
# objects and the Additional Flash Functions are named by a build that
# wants them. Ports turn the defaults off and name what they use.
default = [
    "level15",
    "level25",
    "nonspacing-attributes",
    "level25-32colors",
    "level35-32colors",
    "render",
    "bedstead",
    "viewer",
    "extended-sets",
]
# neoteletext's own character sets at values Table 32 reserves
# (REQ-CHR-012, decision E.78). Without it those values are reserved.
extended-sets = []
# The Level 1.5 pass (area L15).
level15 = []
# The enhancement processor for Levels 2.5 and 3.5 (areas L25 and OBJ):
# non-spacing attributes and characters. The capabilities below are each a
# feature of their own (decision E.71, REQ-GEN-020).
level25 = []
# The non-spacing attributes (Table 27): colours, flash and display
# attributes placed by X/26 triplets. On by default (decision E.105);
# without it those triplets only set the column, and characters and objects
# are still placed.
nonspacing-attributes = ["level25"]
# Active, Adaptive and Passive objects, and default objects (area OBJ).
objects = ["level25"]
# The Colour Map of Level 2.5 (clause 12.4): CLUTs 2 and 3, redefined by
# X/28/0 Format 1 and M/29/0 (Tables 4 and 11). Without it they are copies
# of CLUTs 0 and 1 (decision E.105).
level25-32colors = ["level25"]
# The Colour Map of Level 3.5: as Level 2.5, and CLUTs 0 and 1 redefined by
# X/28/4 and M/29/4 (Tables 10 and 13), never CLUT 1 entry 0, which is
# transparent (decision E.105).
level35-32colors = ["level25-32colors"]
# Additional Flash Functions (Table 29, column mode 00111): the flash
# modes and the flash rates and phases beyond Level 1's flash (decision
# E.105, which names it as the standard does).
additional-flash-functions = ["nonspacing-attributes"]
# The classic profile: teletext as nearly every service sent it and nearly
# every receiver showed it, Level 1.5 and nothing of Levels 2.5 and 3.5.
# A page using a later level shows as a Level 1.5 receiver showed it. Pair
# it with `Config::saa5246a()`, or `Config::saa5050()` for Level 1.0. Used
# with the default features off.
classic = ["level15", "render", "bedstead", "viewer"]
# The modern-classic profile (decision E.71): Level 1.5, and of Levels 2.5
# and 3.5 only the non-spacing attributes and objects. Used with the
# default features off.
modern-classic = ["level15", "level25", "nonspacing-attributes", "render", "bedstead", "viewer", "objects"]
# The row renderer and the generated G3 glyphs (area RND).
render = []
# Bedstead, the one bundled font (REQ-FNT-001, decision E.72).
bedstead = ["render"]
# The viewer state machine, navigation and history (area NAV).
viewer = []
# REQ-GEN-011 and REQ-GEN-016: `core::error::Error` for the error types,
# which needs `core::fmt`.
error-trait = []
# REQ-GEN-016: `core::fmt` only in Debug implementations, and behind this feature.
debug-fmt = []

[dev-dependencies]
proptest = "1.7.0"

[lints]
workspace = true

# Decision E.61: tests and examples that use an optional area build only
# when it is compiled in.
[[test]]
name = "behaviour"
required-features = ["level15", "render", "viewer"]

[[test]]
name = "numbering"
# Area NUM through the decoder, the store and the viewer.
required-features = ["viewer"]

[[test]]
name = "capabilities"
required-features = ["level15", "level25"]

[[test]]
name = "coverage"
required-features = ["bedstead"]

[[test]]
name = "level25"
# The whole of Levels 2.5 and 3.5: every capability (decision E.71).
required-features = [
    "level15",
    "level25",
    "objects",
    "level35-32colors",
]

[[test]]
name = "level25_attributes"
# The non-spacing attributes, a capability of their own, off by default
# (decision E.71).
required-features = [
    "nonspacing-attributes",
    "level15",
    "level25",
    "objects",
    "level35-32colors",
]

[[test]]
name = "objects"
required-features = ["level25", "objects"]

[[test]]
name = "performance"
required-features = ["level25", "bedstead"]

[[test]]
name = "flash_cost"
required-features = ["level25", "bedstead"]

[[test]]
name = "reporting"
# Its pages invoke objects, which are not default (decision E.105).
required-features = ["level15", "level25", "viewer", "objects"]

[[example]]
name = "minimal_port"
required-features = ["level15", "bedstead"]

[package]
name = "neoteletext-core"
description = "World System Teletext Level 1.0 to 3.5 decoder core: no_std, no allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# REQ-GEN-017 and decision E.38: no dependencies outside `core`.
[dependencies]

[features]
# Decision E.61: each optional area of the core is a feature, all on by
# default. Ports turn the defaults off and name what they use.
default = [
    "level15",
    "level25",
    "render",
    "bedstead",
    "viewer",
    "forms",
    "objects",
    "side-panels",
    "colours32",
    "extended-sets",
]
# neoteletext's own character sets at values Table 32 reserves
# (REQ-CHR-012, decision E.78). Without it those values are reserved.
extended-sets = []
# The Level 1.5 pass (area L15).
level15 = []
# The enhancement processor for Levels 2.5 and 3.5 (areas L25 and OBJ):
# non-spacing attributes and characters. The capabilities below are each a
# feature of their own (decision E.71, REQ-GEN-020).
level25 = []
# The non-spacing attributes (Table 27): colours, flash and display
# attributes placed by X/26 triplets. Off by default, the
# owner's choice: without it those triplets only set the column, and
# characters and objects are still placed.
nonspacing-attributes = ["level25"]
# Active, Adaptive and Passive objects, and default objects (area OBJ).
objects = ["level25"]
# Side panels (clause 12.5).
side-panels = ["level25"]
# CLUTs 2 and 3 and the redefinition of any CLUT (clause 12.4).
colours32 = ["level25"]
# Additional Flash Functions: flash modes, fast rates and phases (Table 29).
animation = ["nonspacing-attributes"]
# The classic profile: teletext as nearly every service sent it and nearly
# every receiver showed it, Level 1.5 and nothing of Levels 2.5 and 3.5.
# A page using a later level shows as a Level 1.5 receiver showed it. Pair
# it with `Config::saa5246a()`, or `Config::saa5050()` for Level 1.0. Used
# with the default features off.
classic = ["level15", "render", "bedstead", "viewer"]
# The modern-classic profile (decision E.71): Level 1.5, and of Levels 2.5
# and 3.5 only the non-spacing attributes and objects. Used with the
# default features off.
modern-classic = ["level15", "level25", "nonspacing-attributes", "render", "bedstead", "viewer", "forms", "objects"]
# The row renderer and the generated G3 glyphs (area RND).
render = []
# Bedstead, the one bundled font (REQ-FNT-001, decision E.72).
bedstead = ["render"]
# The viewer state machine, navigation and history (area NAV).
viewer = []
# The forms model (Appendix C).
forms = []
# REQ-GEN-011 and REQ-GEN-016: `core::error::Error` for the error types,
# which needs `core::fmt`.
error-trait = []
# REQ-GEN-016: `core::fmt` only in Debug implementations, and behind this feature.
debug-fmt = []

[dev-dependencies]
proptest = "1.7.0"

[lints]
workspace = true

# Decision E.61: tests and examples that use an optional area build only
# when it is compiled in.
[[test]]
name = "behaviour"
required-features = ["level15", "render", "viewer", "forms"]

[[test]]
name = "capabilities"
required-features = ["level15", "level25"]

[[test]]
name = "coverage"
required-features = ["bedstead"]

[[test]]
name = "level25"
# The whole of Levels 2.5 and 3.5: every capability (decision E.71).
required-features = [
    "level15",
    "level25",
    "objects",
    "side-panels",
    "colours32",
]

[[test]]
name = "level25_attributes"
# The non-spacing attributes, a capability of their own, off by default
# (decision E.71).
required-features = [
    "nonspacing-attributes",
    "level15",
    "level25",
    "objects",
    "side-panels",
    "colours32",
]

[[test]]
name = "objects"
required-features = ["level25", "objects"]

[[test]]
name = "performance"
required-features = ["level25", "bedstead"]

[[test]]
name = "reporting"
required-features = ["level15", "level25", "viewer"]

[[example]]
name = "minimal_port"
required-features = ["level15", "bedstead"]

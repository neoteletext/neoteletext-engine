[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The glyph inventory reads the character set tables (decision E.62).
neoteletext-core = { workspace = true, features = ["render"] }
# The glyph proof sheets are PNG images.
neoteletext-image = { workspace = true, features = ["std"] }
# The authored test stream of REQ-TST-024 is built by the formats crate.
neoteletext-formats = { workspace = true, features = ["std", "tti"] }

[lints]
workspace = true

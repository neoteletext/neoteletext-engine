[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The list of required characters reads the character set tables.
neoteletext-core = { workspace = true, features = ["render", "extended-sets"] }
# The Noto Teletext files are checked by SHA-256 (REQ-FNT-012).
neoteletext-web = { workspace = true }
# The authored test stream of REQ-TST-024 is built by the formats crate, and
# its reader of loaded fonts reads the Noto Teletext files.
neoteletext-formats = { workspace = true, features = ["std", "tti", "bdf"] }
# The generated protocol document's byte examples use the input encoder.
neoteletext-input = { workspace = true }
# They use the audio encoder, for the audio records and their carriage.
neoteletext-audio = { workspace = true, features = ["default", "encode", "pcm16"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "crates/neoteletext-core",
    "crates/neoteletext-formats",
    "crates/neoteletext-slicer",
    "crates/neoteletext-web",
    "crates/neoteletext-image",
    "crates/neoteletext-audio",
    "crates/neoteletext-audio-mix",
    "crates/neoteletext-opus",
    "crates/neoteletext-input",
    "crates/neoteletext-qrkeyboard",
    "crates/neoteletext-app",
    "crates/neoteletext-cli",
    "xtask",
]
default-members = ["crates/neoteletext-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# REQ-GEN-001: at most three stable releases behind 1.99.
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
# Decision E.61: crates name the features of the core, the formats and
# the web module that they use, so that feature unification never brings
# an area into a build that did not ask for it.
neoteletext-core = { path = "crates/neoteletext-core", default-features = false }
neoteletext-formats = { path = "crates/neoteletext-formats", default-features = false }
neoteletext-slicer = { path = "crates/neoteletext-slicer" }
neoteletext-web = { path = "crates/neoteletext-web", default-features = false }
neoteletext-image = { path = "crates/neoteletext-image" }
neoteletext-audio = { path = "crates/neoteletext-audio", default-features = false }
neoteletext-audio-mix = { path = "crates/neoteletext-audio-mix" }
neoteletext-opus = { path = "crates/neoteletext-opus" }
neoteletext-input = { path = "crates/neoteletext-input" }
neoteletext-qrkeyboard = { path = "crates/neoteletext-qrkeyboard" }
neoteletext-app = { path = "crates/neoteletext-app", default-features = false }
# Decision E.38: the only external crate a microcontroller crate may use.
embedded-io = { version = "0.7.1", default-features = false }

[workspace.lints.rust]
# REQ-SEC-015: only the C interface crate (REQ-GEN-018) may contain unsafe
# code, and it will override this lint for itself alone.
unsafe_code = "forbid"
# REQ-DOC-001: every public item is documented; warnings are errors in the
# gates.
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Narrow, justified exceptions to pedantic (REQ-GEN-006):
# teletext code is full of deliberate u8/u16/u32 narrowing after range checks.
cast_possible_truncation = "allow"
# Module and type names repeat by design (charset::Charset, packet::Packet).
module_name_repetitions = "allow"
# Error docs are written per type, not per function.
missing_errors_doc = "allow"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

# Fast rebuilds while behaviour is being shaped (scripts/try.sh): release
# optimisation without link-time optimisation, built incrementally.
[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

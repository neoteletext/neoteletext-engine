# Fuzzing targets for `cargo fuzz` (REQ-TST-040). Outside the workspace:
# libFuzzer needs a nightly compiler, and the library crates must build on
# stable without it.
[package]
name = "tellytxt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
tellytxt-core = { path = "../crates/tellytxt-core" }
# `std` for the TTI writer, which the enhancement-line target writes back.
tellytxt-formats = { path = "../crates/tellytxt-formats", features = ["std"] }
tellytxt-slicer = { path = "../crates/tellytxt-slicer" }
tellytxt-web = { path = "../crates/tellytxt-web" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "formats"
path = "fuzz_targets/formats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tti_enhancement"
path = "fuzz_targets/tti_enhancement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packets"
path = "fuzz_targets/packets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slicer"
path = "fuzz_targets/slicer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket"
path = "fuzz_targets/websocket.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "descriptor"
path = "fuzz_targets/descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "address"
path = "fuzz_targets/address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookie"
path = "fuzz_targets/cookie.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

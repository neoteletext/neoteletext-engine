# The linked microcontroller test image of REQ-GEN-009 and REQ-GEN-019,
# built by `cargo xtask size`. Outside the workspace: it is a bare-metal
# program with no `main`, which the host test run cannot link, and its
# features choose the build being measured (decision E.61).
[package]
name = "neoteletext-test-image"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
neoteletext-core = { path = "../../crates/neoteletext-core", default-features = false }
neoteletext-formats = { path = "../../crates/neoteletext-formats", default-features = false }
neoteletext-web = { path = "../../crates/neoteletext-web", default-features = false }

[features]
# Each feature roots the entry points of one optional area, and enables it.
level15 = ["neoteletext-core/level15"]
level25 = ["neoteletext-core/level25"]
render = ["neoteletext-core/render"]
bedstead = ["render", "neoteletext-core/bedstead"]
original = ["render", "neoteletext-core/original"]
viewer = ["neoteletext-core/viewer"]
forms = ["neoteletext-core/forms"]
# The format readers through detection; formats-all adds every reader.
formats = []
formats-all = ["formats", "neoteletext-formats/default"]
# The web user agent; web-all adds push, forms and cookies.
web = []
web-all = ["web", "neoteletext-web/default"]
# REQ-GEN-019: a deliberate floating-point operation, so that the symbol
# check can be shown to fail.
float-probe = []

[workspace]
members = ["."]

# REQ-GEN-009 and REQ-GEN-019: the image is measured as a port would ship it.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
